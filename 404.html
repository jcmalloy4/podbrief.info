<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PodBrief - AI-Powered Podcast Briefings</title>
    
    <!-- Open Graph for rich previews - iMessage will use these -->
    <meta property="og:title" content="PodBrief - AI-Powered Podcast Briefings">
    <meta property="og:description" content="Get instant AI-powered briefings for your favorite podcast episodes. Save time and never miss key insights.">
    <meta property="og:image" content="https://podbrief.info/Assets/podbrief_preview_optimized.png">
    <meta property="og:url" content="https://podbrief.info">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PodBrief">
    
    <!-- Twitter Card metadata -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PodBrief - AI-Powered Podcast Briefings">
    <meta name="twitter:description" content="Get instant AI-powered briefings for your favorite podcast episodes. Save time and never miss key insights.">
    <meta name="twitter:image" content="https://podbrief.info/Assets/podbrief_preview_optimized.png">
    
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        .loading-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #6366f1;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #888;
            margin-bottom: 2rem;
        }
        
        .fallback-message {
            max-width: 500px;
            display: none;
        }
        
        .fallback-message h2 {
            color: white;
            margin-bottom: 1rem;
        }
        
        .fallback-message p {
            color: #ccc;
            line-height: 1.6;
        }
        
        .home-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 1rem;
            transition: transform 0.2s ease;
        }
        
        .home-button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <p class="loading-text">Loading PodBrief...</p>
        
        <div class="fallback-message" id="fallback-message">
            <h2>Looking for an episode briefing?</h2>
            <p>We're redirecting you to the right place. If you're looking for a specific episode briefing, make sure you have the PodBrief app installed.</p>
            <a href="/" class="home-button">Go to PodBrief Home</a>
        </div>
    </div>

    <script>
        function handleRouting() {
            const path = window.location.pathname;
            const params = path.split('/').filter(p => p);
            
            console.log('404 handling path:', path, 'params:', params);
            
            // Check if this is a briefing URL: /briefing/{podcastId}/{episodeGuid}
            if (params.length >= 3 && params[0] === 'briefing') {
                const podcastId = params[1];
                const episodeGuid = params[2];
                
                console.log('Detected briefing URL - podcastId:', podcastId, 'episodeGuid:', episodeGuid);
                
                // Store the episode data for the briefing page to access
                sessionStorage.setItem('briefingData', JSON.stringify({
                    podcastId: podcastId,
                    episodeGuid: episodeGuid,
                    originalPath: path
                }));
                
                // Try to redirect to existing Jekyll page first (format: podcastId-episodeGuid)
                const jekyllPageUrl = `/briefing/${podcastId}-${episodeGuid}/`;
                
                // Test if Jekyll page exists by making a head request
                fetch(jekyllPageUrl, { method: 'HEAD' })
                    .then(response => {
                        if (response.ok) {
                            // Jekyll page exists, redirect there
                            window.location.href = jekyllPageUrl;
                        } else {
                            // No Jekyll page exists, create dynamic metadata and redirect
                            createDynamicBriefingPage(podcastId, episodeGuid);
                        }
                    })
                    .catch(() => {
                        // Network error or CORS, fallback to dynamic page
                        createDynamicBriefingPage(podcastId, episodeGuid);
                    });
                
                return;
            }
            
            // For other URLs, show fallback after a delay
            setTimeout(() => {
                document.querySelector('.loading-spinner').style.display = 'none';
                document.querySelector('.loading-text').style.display = 'none';
                document.getElementById('fallback-message').style.display = 'block';
            }, 2000);
        }
        
        function createDynamicBriefingPage(podcastId, episodeGuid) {
            // Update the current page with dynamic Open Graph metadata
            updatePageMetadata(podcastId, episodeGuid);
            
            // Show loading state and then redirect
            document.querySelector('.loading-text').textContent = 'Opening PodBrief App...';
            
            // Attempt app redirect similar to Jekyll pages
            setTimeout(() => {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
                const isAndroid = /Android/.test(navigator.userAgent);
                
                if (isIOS) {
                    window.location.href = `podbrief://briefing/${podcastId}/${episodeGuid}`;
                    setTimeout(() => {
                        window.location.href = 'https://apps.apple.com/app/podbrief/idYOUR-APP-ID';
                    }, 2000);
                } else if (isAndroid) {
                    window.location.href = `intent://briefing/${podcastId}/${episodeGuid}#Intent;scheme=podbrief;package=com.johncmalloy4.PodBrief;S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.johncmalloy4.PodBrief;end`;
                } else {
                    window.location.href = `/briefing/?podcast=${podcastId}&episode=${episodeGuid}`;
                }
            }, 1000);
        }
        
        function updatePageMetadata(podcastId, episodeGuid) {
            // Update title
            document.title = 'PodBrief - AI-Powered Podcast Briefings';
            
            // Update or create Open Graph meta tags
            const metaTags = [
                { property: 'og:title', content: 'PodBrief - AI-Powered Podcast Briefings' },
                { property: 'og:description', content: 'Get instant AI-powered briefings for your favorite podcast episodes. Save time and never miss key insights.' },
                { property: 'og:image', content: 'https://podbrief.info/Assets/podbrief_preview_optimized.jpg' },
                { property: 'og:url', content: `https://podbrief.info/briefing/${podcastId}/${episodeGuid}/` },
                { property: 'og:type', content: 'website' },
                { property: 'og:site_name', content: 'PodBrief' },
                { name: 'twitter:card', content: 'summary_large_image' },
                { name: 'twitter:title', content: 'PodBrief - AI-Powered Podcast Briefings' },
                { name: 'twitter:description', content: 'Get instant AI-powered briefings for your favorite podcast episodes. Save time and never miss key insights.' },
                { name: 'twitter:image', content: 'https://podbrief.info/Assets/podbrief_preview_optimized.jpg' }
            ];
            
            metaTags.forEach(tag => {
                const identifier = tag.property ? `meta[property="${tag.property}"]` : `meta[name="${tag.name}"]`;
                let metaTag = document.querySelector(identifier);
                
                if (!metaTag) {
                    metaTag = document.createElement('meta');
                    if (tag.property) metaTag.setAttribute('property', tag.property);
                    if (tag.name) metaTag.setAttribute('name', tag.name);
                    document.head.appendChild(metaTag);
                }
                
                metaTag.setAttribute('content', tag.content);
            });
        }
        
        // Start routing when page loads
        window.addEventListener('load', handleRouting);
    </script>
</body>
</html>
