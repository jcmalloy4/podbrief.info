<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PodBrief - AI-Powered Podcast Briefings</title>
    
    <!-- Universal Open Graph metadata for all briefing URLs -->
    <meta property="og:title" content="PodBrief - AI-Powered Podcast Briefings">
    <meta property="og:description" content="Get instant AI-powered briefings for your favorite podcast episodes. Save time and never miss key insights.">
    <meta property="og:image" content="https://podbrief.info/Assets/podbrief_preview_optimized.jpg">
    <meta property="og:url" content="https://podbrief.info">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PodBrief">
    
    <!-- Twitter Card metadata -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PodBrief - AI-Powered Podcast Briefings">
    <meta name="twitter:description" content="Get instant AI-powered briefings for your favorite podcast episodes. Save time and never miss key insights.">
    <meta name="twitter:image" content="https://podbrief.info/Assets/podbrief_preview_optimized.jpg">
    
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        .loading-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #6366f1;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #888;
            margin-bottom: 2rem;
        }
        
        .fallback-message {
            max-width: 500px;
            display: none;
        }
        
        .fallback-message h2 {
            color: white;
            margin-bottom: 1rem;
        }
        
        .fallback-message p {
            color: #ccc;
            line-height: 1.6;
        }
        
        .home-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 1rem;
            transition: transform 0.2s ease;
        }
        
        .home-button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="loading-spinner"></div>
        <p class="loading-text">Opening PodBrief...</p>
        
        <div class="fallback-message" id="fallback-message">
            <h2>Looking for an episode briefing?</h2>
            <p>We're redirecting you to the right place. If you're looking for a specific episode briefing, make sure you have the PodBrief app installed.</p>
            <a href="/" class="home-button">Go to PodBrief Home</a>
        </div>
    </div>

    <script>
        function handleBriefingRedirect() {
            const path = window.location.pathname;
            const params = path.split('/').filter(p => p);
            
            // Check if this is a briefing URL
            if (params.length >= 2 && params[0] === 'briefing') {
                // Handle both formats:
                // /briefing/podcastId/episodeGuid/ (old format)
                // /briefing/podcastId-episodeGuid/ (new format)
                
                let podcastId, episodeGuid;
                
                if (params.length >= 3) {
                    // Old format: /briefing/podcastId/episodeGuid/
                    podcastId = params[1];
                    episodeGuid = params[2];
                } else {
                    // New format: /briefing/podcastId-episodeGuid/
                    const combined = params[1];
                    const parts = combined.split('-');
                    if (parts.length >= 2) {
                        podcastId = parts[0];
                        episodeGuid = parts.slice(1).join('-'); // In case GUID contains dashes
                    }
                }
                
                if (podcastId && episodeGuid) {
                    document.querySelector('.loading-text').textContent = 'Opening PodBrief App...';
                    
                    // Redirect to app after a brief delay
                    setTimeout(() => {
                        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
                        const isAndroid = /Android/.test(navigator.userAgent);
                        
                        if (isIOS) {
                            // Try to open app, fallback to App Store
                            window.location.href = `podbrief://briefing/${podcastId}/${episodeGuid}`;
                            setTimeout(() => {
                                window.location.href = 'https://apps.apple.com/app/your-app-id';
                            }, 2000);
                        } else if (isAndroid) {
                            // Android intent URL
                            window.location.href = `intent://briefing/${podcastId}/${episodeGuid}#Intent;scheme=podbrief;package=com.johncmalloy4.PodBrief;S.browser_fallback_url=https://play.google.com/store/apps/details?id=com.johncmalloy4.PodBrief;end`;
                        } else {
                            // Desktop fallback - could redirect to web app or show instructions
                            window.location.href = `/briefing/?podcast=${podcastId}&episode=${episodeGuid}`;
                        }
                    }, 1000);
                    
                    return;
                }
            }
            
            // For non-briefing URLs, show fallback message
            setTimeout(() => {
                document.querySelector('.loading-spinner').style.display = 'none';
                document.querySelector('.loading-text').style.display = 'none';
                document.getElementById('fallback-message').style.display = 'block';
            }, 2000);
        }
        
        // Start handling when page loads
        window.addEventListener('load', handleBriefingRedirect);
    </script>
</body>
</html>
