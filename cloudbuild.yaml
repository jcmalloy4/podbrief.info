steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/podbrief-website:latest', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/podbrief-website:latest']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'podbrief-website'
      - '--image'
      - 'gcr.io/$PROJECT_ID/podbrief-website:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--timeout'
      - '300'
      - '--set-env-vars'
      - 'NODE_ENV=production,BACKEND_URL=https://podbrief-5kgqcgqjsa-uc.a.run.app,FIREBASE_API_KEY=${_FIREBASE_API_KEY}'

# Substitution variables (set these in Cloud Build trigger or pass via command line)
substitutions:
  _FIREBASE_API_KEY: 'AIzaSyBwzuCxw26DuhZa0Bp7wZ91riYAa7ehc0U'

images:
  - 'gcr.io/$PROJECT_ID/podbrief-website:latest' 