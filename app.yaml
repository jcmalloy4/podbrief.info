# DEPRECATED: This file was used for App Engine deployment
# The application has been migrated to Cloud Run
# This file is kept for reference only

runtime: nodejs20

# Environment variables
env_variables:
  NODE_ENV: production
  # Backend API URL - Using the actual PodBrief backend service
  BACKEND_URL: https://podbrief-5kgqcgqjsa-uc.a.run.app
  # Firebase API Key - NOW CONFIGURED IN CLOUD RUN ENVIRONMENT
  # FIREBASE_API_KEY: [REMOVED FOR SECURITY - SET IN CLOUD RUN]
  # Firebase will use the default service account when deployed on GCP
  # Make sure your App Engine default service account has Firebase Admin permissions

# Instance configuration
automatic_scaling:
  min_instances: 0
  max_instances: 10
  target_cpu_utilization: 0.6

# Static file handlers for assets
handlers:
- url: /Assets
  static_dir: Assets
  
- url: /(.*\.(css|js|png|jpg|jpeg|gif|ico|svg))$
  static_files: \1
  upload: .*\.(css|js|png|jpg|jpeg|gif|ico|svg)$
  
- url: /.*
  script: auto
  secure: always 