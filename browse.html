<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse PodBriefs - PodBrief</title>
    <meta name="description" content="Search and browse 10,000+ AI-powered podcast briefs. Get instant summaries of your favorite podcast episodes.">
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .browse-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        
        .browse-header {
            text-align: center;
            margin-bottom: 3rem;
            padding-top: 2rem;
        }
        
        .browse-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #fff;
        }
        
        .browse-header p {
            font-size: 1.2rem;
            color: #ccc;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .search-box {
            max-width: 600px;
            margin: 2rem auto;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 1rem 3rem 1rem 1.5rem;
            font-size: 1rem;
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            transition: all 0.3s ease;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.08);
        }
        
        .search-box input::placeholder {
            color: #888;
        }
        
        .search-icon {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 1.2rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            color: #888;
        }
        
        .briefs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .brief-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.25rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .brief-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.2);
        }
        
        .brief-card .podcast-name {
            color: #8b5cf6;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .brief-card h3 {
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            margin: 0;
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: #888;
        }
        
        @media (max-width: 768px) {
            .browse-header h1 {
                font-size: 2rem;
            }
            
            .briefs-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .browse-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="navbar-content">
            <div class="navbar-logo">
                <a href="/" style="display: flex; align-items: center; text-decoration: none; color: inherit;">
                    <img src="/Assets/podbrief_logo.png" alt="PodBrief Logo">
                    <span>PodBrief</span>
                </a>
            </div>
            <nav class="navbar-links">
                <a href="/">Home</a>
                <a href="/browse.html">Browse Briefs</a>
                <a href="/faq.html">FAQ</a>
            </nav>
        </div>
    </header>

    <div class="browse-container">
        <div class="browse-header">
            <h1>Browse PodBriefs</h1>
            <p>Search through 10,000+ AI-powered podcast summaries</p>
        </div>

        <div class="search-box">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search by podcast name..."
                autocomplete="off"
            >
            <span class="search-icon">🔍</span>
        </div>

        <div id="briefsList">
            <div class="loading">Loading briefs...</div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2024 PodBrief. All rights reserved.</p>
        </div>
    </footer>

    <script>
        let allBriefs = [];
        let briefsMetadata = [];
        let isLoading = false;
        
        // Extract date from URL (episodes have GUIDs that sometimes contain dates)
        function extractDateFromUrl(url) {
            // Try to extract episode GUID which might contain date info
            const parts = url.split('/');
            const guid = parts[parts.length - 1].replace('.html', '');
            return guid; // Use GUID for ordering (newer GUIDs tend to be more recent)
        }
        
        // Load briefs from sitemap
        async function loadBriefs() {
            try {
                const response = await fetch('/sitemap-briefs.xml');
                const text = await response.text();
                const parser = new DOMParser();
                const xml = parser.parseFromString(text, 'text/xml');
                const urls = xml.querySelectorAll('loc');
                
                allBriefs = Array.from(urls).map(loc => loc.textContent);
                
                // Reverse to show newest first (sitemap is generated in order)
                allBriefs.reverse();
                
                const initial = allBriefs.slice(0, 50);
                await loadBriefsMetadata(initial);
                renderBriefs(briefsMetadata);
            } catch (error) {
                document.getElementById('briefsList').innerHTML = '<div class="no-results">Error loading briefs. Please try again.</div>';
            }
        }
        
        // Fetch brief metadata from the brief pages
        async function loadBriefsMetadata(urls) {
            isLoading = true;
            briefsMetadata = [];
            
            const promises = urls.map(async url => {
                try {
                    const response = await fetch(url);
                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    
                    const episodeTitle = doc.querySelector('.episode-title')?.textContent || 'Episode';
                    const podcastName = doc.querySelector('.podcast-name')?.textContent || 'Unknown Podcast';
                    
                    return { 
                        episodeTitle, 
                        podcastName, 
                        url,
                        podcastNameLower: podcastName.toLowerCase()
                    };
                } catch {
                    return null;
                }
            });
            
            const results = await Promise.all(promises);
            briefsMetadata = results.filter(r => r !== null);
            isLoading = false;
        }
        
        // Render briefs
        function renderBriefs(briefs) {
            const container = document.getElementById('briefsList');
            
            if (briefs.length === 0) {
                container.innerHTML = '<div class="no-results">No briefs found. Try a different search.</div>';
                return;
            }
            
            container.innerHTML = '<div class="briefs-grid" id="grid"></div>';
            const grid = document.getElementById('grid');
            
            briefs.forEach(brief => {
                const card = document.createElement('div');
                card.className = 'brief-card';
                card.onclick = () => window.location.href = brief.url;
                card.innerHTML = `
                    <div class="podcast-name">${brief.podcastName}</div>
                    <h3>${brief.episodeTitle}</h3>
                `;
                grid.appendChild(card);
            });
        }
        
        // Search functionality - prioritize podcast name
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', async (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value.toLowerCase().trim();
            
            if (!query) {
                renderBriefs(briefsMetadata);
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                // Search through all briefs, prioritizing podcast name matches
                const matchingUrls = allBriefs.filter(url => {
                    const lowerUrl = url.toLowerCase();
                    // Check if query appears in URL (simple check)
                    return lowerUrl.includes(query);
                });
                
                // Load metadata for matching briefs
                const toLoad = matchingUrls.slice(0, 100);
                await loadBriefsMetadata(toLoad);
                
                // Filter and sort: podcast name matches first, then episode matches
                const filtered = briefsMetadata.filter(brief => 
                    brief.podcastNameLower.includes(query) || 
                    brief.episodeTitle.toLowerCase().includes(query)
                );
                
                // Sort: podcast name matches first, then by order (recency)
                filtered.sort((a, b) => {
                    const aPodcastMatch = a.podcastNameLower.includes(query);
                    const bPodcastMatch = b.podcastNameLower.includes(query);
                    
                    if (aPodcastMatch && !bPodcastMatch) return -1;
                    if (!aPodcastMatch && bPodcastMatch) return 1;
                    return 0; // Keep original order (most recent first)
                });
                
                renderBriefs(filtered);
            }, 300);
        });
        
        // Load on page load
        loadBriefs();
    </script>
</body>
</html>
