<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">PodBrief - Episode Briefing</title>
    
    <!-- Dynamic meta tags that will be updated immediately -->
    <meta property="og:title" content="PodBrief - Episode Briefing" id="og-title">
    <meta property="og:description" content="Get an AI-powered briefing for this podcast episode." id="og-description">
    <meta property="og:image" content="https://podbrief.info/Assets/podbrief_logo.png" id="og-image">
    <meta property="og:url" content="https://podbrief.info" id="og-url">
    <meta property="og:type" content="website">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PodBrief - Episode Briefing" id="twitter-title">
    <meta name="twitter:description" content="Get an AI-powered briefing for this podcast episode." id="twitter-description">
    <meta name="twitter:image" content="https://podbrief.info/Assets/podbrief_logo.png" id="twitter-image">
    
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        .briefing-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
            color: white;
            padding: 2rem;
        }
        
        .briefing-content {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .episode-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .episode-image {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            margin: 0 auto 1.5rem;
            object-fit: cover;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .episode-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: white;
        }
        
        .podcast-title {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 1rem;
        }
        
        .episode-description {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #6366f1;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-state {
            text-align: center;
            padding: 4rem 2rem;
        }
        
        .error-message {
            color: #ff6b6b;
            margin-bottom: 2rem;
        }
        
        @media (max-width: 768px) {
            .briefing-container {
                padding: 1rem;
            }
            
            .episode-image {
                width: 150px;
                height: 150px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="briefing-container">
        <div class="briefing-content">
            <!-- Loading State -->
            <div id="loading-state" class="loading-state">
                <div class="loading-spinner"></div>
                <h2>Loading Episode Briefing...</h2>
                <p>Preparing your AI-powered podcast briefing</p>
            </div>
            
            <!-- Error State -->
            <div id="error-state" class="error-state" style="display: none;">
                <h2>Episode Not Found</h2>
                <p class="error-message">We couldn't find the episode you're looking for.</p>
                <a href="/" class="btn btn-primary">Return to PodBrief</a>
            </div>
            
            <!-- Episode Content -->
            <div id="episode-content" style="display: none;">
                <div class="episode-header">
                    <img id="episode-image" class="episode-image" src="/Assets/podbrief_preview.png" alt="Episode artwork">
                    <h1 id="episode-title" class="episode-title">Loading...</h1>
                    <p id="podcast-title" class="podcast-title">Loading...</p>
                    <p id="episode-description" class="episode-description">Loading episode details...</p>
                    
                    <div class="action-buttons">
                        <button id="open-app-btn" class="btn btn-primary">Open in PodBrief App</button>
                        <a href="/" class="btn btn-secondary">Browse More Episodes</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Immediately extract episode data and update metadata
        function initializePage() {
            console.log('Initializing briefing page...');
            
            // Get episode data from URL parameters or session storage
            const urlParams = new URLSearchParams(window.location.search);
            const sessionData = sessionStorage.getItem('briefingData');
            
            let podcastId = urlParams.get('podcast');
            let episodeGuid = urlParams.get('episode');
            
            // Check session storage if URL params are missing
            if (!podcastId || !episodeGuid) {
                if (sessionData) {
                    const data = JSON.parse(sessionData);
                    podcastId = data.podcastId;
                    episodeGuid = data.episodeGuid;
                    console.log('Using session storage data:', data);
                }
            }
            
            console.log('Episode data:', { podcastId, episodeGuid });
            
            if (!podcastId || !episodeGuid) {
                showError();
                return;
            }
            
            // Update URL if needed (for clean URLs)
            const currentUrl = window.location.href;
            const expectedUrl = `https://podbrief.info/briefing/?podcast=${podcastId}&episode=${episodeGuid}`;
            updateMetadata(podcastId, episodeGuid, currentUrl);
            
            // Load episode data
            loadEpisodeData(podcastId, episodeGuid);
            
            // Set up app redirect
            setupAppRedirect(podcastId, episodeGuid);
        }
        
        function updateMetadata(podcastId, episodeGuid, currentUrl) {
            // Update page title and meta tags immediately
            const title = `PodBrief - Episode Briefing`;
            const description = `Get an AI-powered briefing for this podcast episode.`;
            const logoUrl = `https://podbrief.info/Assets/podbrief_logo.png`; // Always use PodBrief logo for sharing
            
            document.title = title;
            document.getElementById('page-title').textContent = title;
            
            // Update Open Graph tags
            document.getElementById('og-title').setAttribute('content', title);
            document.getElementById('og-description').setAttribute('content', description);
            document.getElementById('og-image').setAttribute('content', logoUrl);
            document.getElementById('og-url').setAttribute('content', currentUrl);
            
            // Update Twitter Card tags  
            document.getElementById('twitter-title').setAttribute('content', title);
            document.getElementById('twitter-description').setAttribute('content', description);
            document.getElementById('twitter-image').setAttribute('content', logoUrl);
        }
        
        function loadEpisodeData(podcastId, episodeGuid) {
            // Simulate loading episode data (replace with actual API call)
            setTimeout(() => {
                // Mock episode data - replace with actual API call
                const episodeData = {
                    title: `Episode from ${podcastId}`,
                    podcastTitle: 'Sample Podcast',
                    description: 'This is a sample episode description. In a real implementation, this would come from your podcast data API.',
                    imageUrl: '/Assets/podbrief_preview.png', // Replace with actual episode image
                    duration: '45:30'
                };
                
                displayEpisode(episodeData);
                updateMetadataWithEpisodeData(episodeData);
            }, 1000);
        }
        
        function displayEpisode(episodeData) {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('episode-content').style.display = 'block';
            
            document.getElementById('episode-image').src = episodeData.imageUrl;
            document.getElementById('episode-image').alt = episodeData.title;
            document.getElementById('episode-title').textContent = episodeData.title;
            document.getElementById('podcast-title').textContent = episodeData.podcastTitle;
            document.getElementById('episode-description').textContent = episodeData.description;
        }
        
        function updateMetadataWithEpisodeData(episodeData) {
            const title = `${episodeData.title} - PodBrief`;
            const description = episodeData.description.substring(0, 160) + '...';
            const logoUrl = `https://podbrief.info/Assets/podbrief_logo.png`; // Always use PodBrief logo for sharing
            
            document.title = title;
            document.getElementById('og-title').setAttribute('content', title);
            document.getElementById('og-description').setAttribute('content', description);
            document.getElementById('og-image').setAttribute('content', logoUrl);
            
            document.getElementById('twitter-title').setAttribute('content', title);
            document.getElementById('twitter-description').setAttribute('content', description);
            document.getElementById('twitter-image').setAttribute('content', logoUrl);
        }
        
        function setupAppRedirect(podcastId, episodeGuid) {
            document.getElementById('open-app-btn').addEventListener('click', function() {
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
                const isAndroid = /Android/.test(navigator.userAgent);
                
                const appUrl = `podbrief://briefing/${podcastId}/${episodeGuid}`;
                const appStoreUrl = 'https://apps.apple.com/app/podbrief/id6748547717';
                const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.PodBrief';
                
                if (isIOS) {
                    // Try to open the app
                    window.open(appUrl, '_blank');
                    
                    // Fallback to App Store after a delay
                    setTimeout(() => {
                        if (confirm('PodBrief app not installed. Download from App Store?')) {
                            window.open(appStoreUrl, '_blank');
                        }
                    }, 2000);
                } else if (isAndroid) {
                    // Try to open the app
                    window.open(appUrl, '_blank');
                    
                    // Fallback to Play Store after a delay
                    setTimeout(() => {
                        if (confirm('PodBrief app not installed. Download from Play Store?')) {
                            window.open(playStoreUrl, '_blank');
                        }
                    }, 2000);
                } else {
                    // Desktop - show download options
                    alert('Download PodBrief on your mobile device to access episode briefings!');
                }
            });
        }
        
        function showError() {
            document.getElementById('loading-state').style.display = 'none';
            document.getElementById('error-state').style.display = 'block';
        }
        
        // Initialize page immediately
        initializePage();
        
        // Handle browser back button
        window.addEventListener('popstate', function(event) {
            initializePage();
        });
    </script>
</body>
</html>
